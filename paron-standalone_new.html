<style>
  :root{
    --ink:#14171a; --ink-soft:#3c4247;
    --paper:#f7f5ee; --paper-dim:#ece8dd;
    --card:#ffffff; --line:#dcd7c8;
    --yellow:#f4c10f; --yellow-ink:#3a2c00;
    --orange:#e8590c;
    --green:#2f7a4b; --green-soft:#e4f0e7;
    --red:#b23a2e; --red-soft:#f6e6e3;
    --shadow: 0 2px 10px rgba(20,23,26,0.08);
    --radius: 10px;
    color-scheme: light;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ink:#f1efe6; --ink-soft:#c9c4b4;
      --paper:#17181a; --paper-dim:#1f2123;
      --card:#212325; --line:#34373a;
      --green-soft:#173324; --red-soft:#3a201d;
      --shadow: 0 2px 14px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f1efe6; --ink-soft:#c9c4b4;
    --paper:#17181a; --paper-dim:#1f2123;
    --card:#212325; --line:#34373a;
    --green-soft:#173324; --red-soft:#3a201d;
    --shadow: 0 2px 14px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed', 'Inter', sans-serif;
    font-weight:600; letter-spacing:.2px; margin:0;
  }
  .app{max-width:900px; margin:0 auto; padding:0 0 90px;}
  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--ink); color:var(--paper);
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:5px solid var(--yellow);
  }
  header.top .brand{display:flex; align-items:center; gap:10px;}
  header.top .logo-chip{
    background:#fff; border-radius:8px; padding:6px 10px; display:flex; align-items:center; flex:none;
  }
  header.top .logo-chip img{height:20px; display:block;}
  header.top .brand .mark{
    width:34px;height:34px;border-radius:6px;background:var(--yellow);
    display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;
  }
  header.top h1{font-size:26px; line-height:1;}
  header.top .clock{font-size:13px; color:var(--paper-dim); opacity:.85; text-align:right; font-variant-numeric: tabular-nums;}
  nav.tabs{
    display:flex; gap:4px; padding:10px 12px; overflow-x:auto;
    background:var(--paper); border-bottom:1px solid var(--line);
    position:sticky; top:64px; z-index:19;
  }
  nav.tabs button{
    flex:1; min-width:84px; border:none; background:transparent; color:var(--ink-soft);
    padding:10px 6px 8px; border-radius:8px; font-family:'Inter'; font-weight:600; font-size:13.5px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
    transition: background .15s ease, color .15s ease;
  }
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{background:var(--ink); color:var(--yellow);}
  main{padding:18px 16px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .muted{color:var(--ink-soft);}
  .row{display:flex; gap:10px; align-items:center;}
  .row.between{justify-content:space-between;}
  .btn{
    font-family:'Inter'; font-weight:600; font-size:14.5px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); padding:11px 16px; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; justify-content:center;
  }
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--ink); color:var(--yellow); border-color:var(--ink);}
  .btn.accent{background:var(--yellow); color:var(--yellow-ink); border-color:var(--yellow);}
  .btn.danger{background:var(--red-soft); color:var(--red); border-color:transparent;}
  .btn.ghost{background:transparent; border-color:var(--line);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.block{width:100%;}
  input, select{
    font-family:'Inter'; font-size:15px; padding:11px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%;
  }
  label{font-size:12.5px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    padding:4px 10px; border-radius:999px;
  }
  .badge.in{background:var(--green-soft); color:var(--green);}
  .badge.out{background:var(--red-soft); color:var(--red);}
  .badge.archived{background:var(--paper-dim); color:var(--ink-soft);}
  .avatar{
    width:44px;height:44px;border-radius:50%; background:var(--paper-dim); color:var(--ink);
    display:flex;align-items:center;justify-content:center; font-weight:700; font-size:15px; flex:none;
    border:2px solid var(--line);
  }
  .avatar.in{border-color:var(--green); color:var(--green);}
  .avatar.out{border-color:var(--red); color:var(--red);}
  .person-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
  .person-row:last-child{border-bottom:none;}
  .person-main{flex:1; min-width:0;}
  .person-main .name{font-weight:600; font-size:15.5px;}
  .person-main .sub{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .empty{text-align:center; padding:36px 18px; color:var(--ink-soft);}
  .empty .ic{font-size:34px; display:block; margin-bottom:8px;}

  /* Scan tab */
  .scan-wrap{position:relative;}
  .cam-box{
    position:relative; width:100%; aspect-ratio:1/1; max-width:420px; margin:0 auto;
    background:#000; border-radius:16px; overflow:hidden; border:3px solid var(--ink);
  }
  .cam-box video{width:100%;height:100%;object-fit:cover;}
  .cam-frame{
    position:absolute; inset:12%; border:3px solid var(--yellow); border-radius:14px;
    box-shadow:0 0 0 999px rgba(0,0,0,.35); pointer-events:none;
  }
  .cam-off{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    height:100%; color:#eee; text-align:center; padding:20px;
  }
  .scan-overlay{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:rgba(20,23,26,.72); padding:20px;
  }
  .scan-card{
    background:var(--card); border-radius:18px; padding:30px 26px; text-align:center; max-width:340px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .scan-card .circle{
    width:76px;height:76px;border-radius:50%; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
    font-size:34px;
  }
  .scan-card .circle.in{background:var(--green-soft); color:var(--green);}
  .scan-card .circle.out{background:var(--red-soft); color:var(--red);}
  .scan-card .circle.err{background:var(--red-soft); color:var(--red);}
  .scan-card h2{font-size:26px; margin-bottom:2px;}
  .scan-card .status-line{font-size:15px; font-weight:600; margin-bottom:10px;}
  .scan-card .status-line.in{color:var(--green);}
  .scan-card .status-line.out{color:var(--red);}
  .scan-card .meta{font-size:13px; color:var(--ink-soft);}

  /* Modal */
  .modal-bg{position:fixed; inset:0; background:rgba(20,23,26,.6); z-index:60; display:flex; align-items:center; justify-content:center; padding:18px;}
  .modal{background:var(--card); border-radius:16px; padding:22px; width:100%; max-width:380px; max-height:88vh; overflow-y:auto;}
  .qr-badge{text-align:center; padding:14px; border:2px dashed var(--line); border-radius:12px; margin:14px 0;}
  .qr-badge #qrHolder{display:flex; justify-content:center; margin-bottom:10px;}
  .qr-badge .bname{font-family:'Barlow Condensed'; font-weight:600; font-size:22px;}
  .qr-badge .brole{font-size:13px; color:var(--ink-soft);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:70;
    background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:999px; font-size:14px; font-weight:600;
    box-shadow:var(--shadow);
  }
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
  th{font-size:12px; text-transform:none; color:var(--ink-soft); font-weight:600;}
  .totals{display:flex; justify-content:space-between; align-items:baseline; padding:10px 2px 2px;}
  .totals .num{font-family:'Barlow Condensed'; font-size:28px; font-weight:600;}
  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>

  <main>
    <!-- SCAN TAB -->
    <section id="tab-scan">
      <div class="card scan-wrap">
        <div class="cam-box" id="camBox">
          <div class="cam-off" id="camOff">
            <div style="font-size:40px;">📷</div>
            <div>Ξεκίνησε την κάμερα για σάρωση κάρτας εργαζομένου.</div>
            <button class="btn accent" id="btnStartCam">Έναρξη κάμερας</button>
          </div>
          <video id="video" playsinline muted style="display:none;"></video>
          <div class="cam-frame" id="camFrame" style="display:none;"></div>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
        <div class="row between" style="margin-top:12px;" id="camControls" hidden>
          <span class="muted" style="font-size:13px;">Δείξε το QR της κάρτας μπροστά στην κάμερα.</span>
          <button class="btn ghost" id="btnStopCam">Διακοπή</button>
        </div>
      </div>

      <div class="card" id="quickManual">
        <div class="row between">
          <h3 style="font-size:16px;">Χειροκίνητη καταγραφή</h3>
        </div>
        <p class="muted" style="font-size:13px; margin:6px 0 12px;">Αν κάποιος δεν έχει μαζί του την κάρτα του.</p>
        <select id="manualSelect"></select>
        <button class="btn primary block" id="btnManualToggle" style="margin-top:10px;">Επιλέξτε εργαζόμενο</button>
      </div>
    </section>

    <!-- PRESENT TAB -->
    <section id="tab-present" hidden>
      <div class="card">
        <div class="row between" style="margin-bottom:6px;">
          <h3 style="font-size:16px;">Μέσα στο έργο τώρα</h3>
          <span class="badge in" id="presentCount">0</span>
        </div>
        <div id="presentList"></div>
      </div>
    </section>

    <!-- PEOPLE TAB -->
    <section id="tab-people" hidden>
      <div class="card">
        <h3 style="font-size:16px; margin-bottom:12px;">Νέος εργαζόμενος</h3>
        <div class="field">
          <label>Ονοματεπώνυμο</label>
          <input id="newName" placeholder="π.χ. Γιάννης Παπαδόπουλος">
        </div>
        <div class="field">
          <label>Ειδικότητα / Ρόλος (προαιρετικό)</label>
          <input id="newRole" placeholder="π.χ. Ηλεκτρολόγος">
        </div>
        <button class="btn primary block" id="btnAddEmployee">Προσθήκη & δημιουργία QR</button>
      </div>

      <div class="card">
        <div class="row between" style="margin-bottom:8px;">
          <h3 style="font-size:16px;">Ενεργό προσωπικό</h3>
          <input id="searchPeople" placeholder="Αναζήτηση…" style="max-width:150px;">
        </div>
        <div id="peopleList"></div>
      </div>

      <div class="card" id="archivedCard" hidden>
        <h3 style="font-size:16px; margin-bottom:8px;">Αρχειοθετημένοι</h3>
        <div id="archivedList"></div>
      </div>
    </section>

    <!-- HISTORY TAB -->
    <section id="tab-history" hidden>
      <div class="card">
        <div class="row" style="gap:10px; flex-wrap:wrap;">
          <div style="flex:1; min-width:150px;">
            <label>Ημερομηνία</label>
            <input type="date" id="historyDate">
          </div>
          <div style="flex:1; min-width:150px;">
            <label>Εργαζόμενος</label>
            <select id="historyFilter"><option value="">Όλοι</option></select>
          </div>
        </div>
        <div class="totals">
          <div class="muted">Σύνολο ωρών ημέρας</div>
          <div class="num" id="dayTotal">0:00</div>
        </div>
        <div id="historyList" style="margin-top:6px;"></div>
        <button class="btn ghost block" id="btnExportCsv" style="margin-top:14px;" hidden>⬇️ Εξαγωγή CSV</button>
      </div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
  "use strict";

  /* ---------- storage ---------- */
  const STORE_KEY = "paron_v1";
  let backend = 'local'; // 'db' | 'local'
  let dbApi = null;
  let state = { employees: [], events: [] };

  function loadLocal(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { employees: [], events: [] };
  }
  function saveLocal(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){
      toast("Δεν ήταν δυνατή η αποθήκευση στη συσκευή.");
    }
  }
  function persistEmployeeSet(emp){
    if(backend==='db'){
      dbApi.collection('employees').doc(emp.id).set({
        name: emp.name, role: emp.role, code: emp.code, archived: emp.archived, createdAt: emp.createdAt
      }).catch(()=>toast("Η αποθήκευση απέτυχε."));
    } else { saveLocal(); }
  }
  function persistEmployeeUpdate(id, patch){
    if(backend==='db'){
      dbApi.collection('employees').doc(id).update(patch).catch(()=>toast("Η ενημέρωση απέτυχε."));
    } else { saveLocal(); }
  }
  function persistEmployeeDelete(id){
    if(backend==='db'){
      dbApi.collection('employees').doc(id).delete().catch(()=>toast("Η διαγραφή απέτυχε."));
    } else { saveLocal(); }
  }
  function persistEventAdd(ev){
    if(backend==='db'){
      dbApi.collection('events').doc(ev.id).set({
        employeeId: ev.employeeId, employeeName: ev.employeeName, type: ev.type, ts: ev.ts
      }).catch(()=>toast("Η καταγραφή απέτυχε."));
    } else { saveLocal(); }
  }
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAxfvArOIdhDVqXwwHLpI7kvQSkEIi7YJI",
    authDomain: "sustain-oxygen.firebaseapp.com",
    projectId: "sustain-oxygen",
    storageBucket: "sustain-oxygen.firebasestorage.app",
    messagingSenderId: "478461885019",
    appId: "1:478461885019:web:1000c54a95490a85071d7e"
  };
  async function initStorage(){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      await firebase.auth().signInAnonymously();
      dbApi = firebase.firestore();
    }catch(e){ dbApi = null; }

    if(dbApi){
      backend = 'db';
      dbApi.collection('employees').onSnapshot(snap=>{
        state.employees = snap.docs.filter(d=>d.exists).map(d=>({ id: d.id, ...d.data() }));
        renderAll();
      }, ()=>{ toast("Πρόβλημα σύνδεσης με την αποθήκευση."); });
      dbApi.collection('events').onSnapshot(snap=>{
        state.events = snap.docs.filter(d=>d.exists).map(d=>({ id: d.id, ...d.data() }));
        renderAll();
      }, ()=>{});
    } else {
      backend = 'local';
      state = loadLocal();
      renderAll();
    }
  }
  function renderAll(){
    renderPeople();
    renderManualSelect();
    renderPresent();
    renderHistory();
  }

  /* ---------- helpers ---------- */
  function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+"-"+Math.random())); }
  function genCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let c = "";
    for(let i=0;i<7;i++) c += chars[Math.floor(Math.random()*chars.length)];
    return "PR-" + c;
  }
  function initials(name){
    return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  }
  function fmtTime(d){ return d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'}); }
  function fmtDur(ms){
    if(ms<0) ms=0;
    const totalMin = Math.round(ms/60000);
    const h = Math.floor(totalMin/60), m = totalMin%60;
    return h + ":" + String(m).padStart(2,'0');
  }
  function todayStr(d){
    const dt = d || new Date();
    return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,'0')+"-"+String(dt.getDate()).padStart(2,'0');
  }
  function toast(msg){
    const root = document.getElementById('toastRoot');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.innerHTML = '';
    root.appendChild(el);
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 2600);
  }

  function activeEmployees(){ return state.employees.filter(e=>!e.archived); }
  function employeeById(id){ return state.employees.find(e=>e.id===id); }
  function employeeByCode(code){ return state.employees.find(e=>e.code===code); }

  function lastEventFor(empId){
    let last = null;
    for(const ev of state.events){
      if(ev.employeeId===empId){
        if(!last || ev.ts > last.ts) last = ev;
      }
    }
    return last;
  }
  function isInside(empId){
    const last = lastEventFor(empId);
    return !!last && last.type === 'in';
  }

  /* ---------- clock ---------- */
  function tickClock(){
    const el = document.getElementById('clock');
    const now = new Date();
    el.textContent = now.toLocaleDateString('el-GR',{weekday:'short', day:'2-digit', month:'2-digit'}) + " · " + fmtTime(now);
  }
  tickClock();
  setInterval(tickClock, 1000*15);

  /* ---------- tabs ---------- */
  const tabs = ['scan','present','people','history'];
  document.getElementById('tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    switchTab(btn.dataset.tab);
  });
  function switchTab(name){
    tabs.forEach(t=>{
      document.getElementById('tab-'+t).hidden = (t!==name);
    });
    document.querySelectorAll('#tabs button').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===name);
    });
    if(name!=='scan') stopCamera();
    if(name==='present') renderPresent();
    if(name==='people') renderPeople();
    if(name==='history') renderHistory();
    if(name==='scan') renderManualSelect();
  }

  /* ---------- add / manage employees ---------- */
  document.getElementById('btnAddEmployee').addEventListener('click', ()=>{
    const nameEl = document.getElementById('newName');
    const roleEl = document.getElementById('newRole');
    const name = nameEl.value.trim();
    if(!name){ toast("Γράψε ένα ονοματεπώνυμο."); nameEl.focus(); return; }
    const emp = { id: uid(), name, role: roleEl.value.trim(), code: genCode(), archived:false, createdAt: new Date().toISOString() };
    state.employees.push(emp);
    persistEmployeeSet(emp);
    nameEl.value=""; roleEl.value="";
    renderPeople();
    renderManualSelect();
    openQrModal(emp, true);
  });

  document.getElementById('searchPeople').addEventListener('input', renderPeople);

  function renderPeople(){
    const list = document.getElementById('peopleList');
    const q = document.getElementById('searchPeople').value.trim().toLowerCase();
    const emps = activeEmployees().filter(e=> !q || e.name.toLowerCase().includes(q));
    if(emps.length===0){
      list.innerHTML = '<div class="empty"><span class="ic">🗂️</span>Δεν υπάρχει ακόμη καταχωρημένο προσωπικό.</div>';
    } else {
      list.innerHTML = emps.map(e=>{
        const inside = isInside(e.id);
        return `<div class="person-row">
          <div class="avatar ${inside?'in':'out'}">${initials(e.name)}</div>
          <div class="person-main">
            <div class="name">${escapeHtml(e.name)}</div>
            <div class="sub">${e.role?escapeHtml(e.role)+' · ':''}${e.code}</div>
          </div>
          <span class="badge ${inside?'in':'out'}">${inside?'Μέσα':'Έξω'}</span>
          <button class="btn ghost" data-qr="${e.id}" style="margin-left:6px;">QR</button>
          <button class="btn ghost" data-archive="${e.id}">Αρχείο</button>
        </div>`;
      }).join('');
    }
    const archived = state.employees.filter(e=>e.archived);
    const archivedCard = document.getElementById('archivedCard');
    archivedCard.hidden = archived.length===0;
    document.getElementById('archivedList').innerHTML = archived.map(e=>`
      <div class="person-row">
        <div class="avatar">${initials(e.name)}</div>
        <div class="person-main"><div class="name">${escapeHtml(e.name)}</div><div class="sub">${e.code}</div></div>
        <button class="btn ghost" data-restore="${e.id}">Επαναφορά</button>
        <button class="btn danger" data-delete="${e.id}">Διαγραφή</button>
      </div>`).join('');
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  document.getElementById('peopleList').addEventListener('click', (e)=>{
    const qr = e.target.closest('[data-qr]');
    const arch = e.target.closest('[data-archive]');
    if(qr){ openQrModal(employeeById(qr.dataset.qr), false); return; }
    if(arch){
      const emp = employeeById(arch.dataset.archive);
      emp.archived = true;
      persistEmployeeUpdate(emp.id, {archived:true}); renderPeople(); renderManualSelect();
      toast(emp.name + " μετακινήθηκε στο αρχείο.");
    }
  });
  document.getElementById('archivedList').addEventListener('click', (e)=>{
    const rest = e.target.closest('[data-restore]');
    const del = e.target.closest('[data-delete]');
    if(rest){
      employeeById(rest.dataset.restore).archived = false;
      persistEmployeeUpdate(rest.dataset.restore, {archived:false}); renderPeople(); renderManualSelect();
    }
    if(del){
      const id = del.dataset.delete;
      const hasEvents = state.events.some(ev=>ev.employeeId===id);
      if(hasEvents){
        toast("Δεν μπορεί να διαγραφεί — υπάρχει ιστορικό. Άφησέ τον στο αρχείο.");
        return;
      }
      if(confirm("Οριστική διαγραφή εργαζομένου;")){
        state.employees = state.employees.filter(e=>e.id!==id);
        persistEmployeeDelete(id); renderPeople();
      }
    }
  });

  function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

  /* ---------- present tab ---------- */
  function renderPresent(){
    const inside = activeEmployees().filter(e=>isInside(e.id));
    document.getElementById('presentCount').textContent = inside.length;
    const list = document.getElementById('presentList');
    if(inside.length===0){
      list.innerHTML = '<div class="empty"><span class="ic">🌙</span>Κανείς δεν είναι μέσα στο έργο αυτή τη στιγμή.</div>';
      return;
    }
    list.innerHTML = inside.map(e=>{
      const last = lastEventFor(e.id);
      const since = new Date(last.ts);
      return `<div class="person-row">
        <div class="avatar in">${initials(e.name)}</div>
        <div class="person-main">
          <div class="name">${escapeHtml(e.name)}</div>
          <div class="sub">Είσοδος ${fmtTime(since)} · <span data-live="${last.ts}">${fmtDur(Date.now()-since.getTime())}</span></div>
        </div>
        <button class="btn ghost" data-checkout="${e.id}">Έξοδος</button>
      </div>`;
    }).join('');
  }
  document.getElementById('presentList').addEventListener('click', (e)=>{
    const co = e.target.closest('[data-checkout]');
    if(!co) return;
    logEvent(co.dataset.checkout, 'out');
    renderPresent();
  });
  setInterval(()=>{
    document.querySelectorAll('[data-live]').forEach(el=>{
      const since = new Date(el.dataset.live);
      el.textContent = fmtDur(Date.now()-since.getTime());
    });
  }, 30000);

  /* ---------- logging ---------- */
  function logEvent(employeeId, type){
    const emp = employeeById(employeeId);
    const ev = { id: uid(), employeeId, employeeName: emp?emp.name:'—', type, ts: new Date().toISOString() };
    state.events.push(ev);
    persistEventAdd(ev);
    return emp;
  }

  /* ---------- manual toggle ---------- */
  function renderManualSelect(){
    const sel = document.getElementById('manualSelect');
    const emps = activeEmployees().slice().sort((a,b)=>a.name.localeCompare(b.name,'el'));
    sel.innerHTML = '<option value="">— Επίλεξε εργαζόμενο —</option>' + emps.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
    updateManualBtn();
  }
  document.getElementById('manualSelect').addEventListener('change', updateManualBtn);
  function updateManualBtn(){
    const sel = document.getElementById('manualSelect');
    const btn = document.getElementById('btnManualToggle');
    if(!sel.value){ btn.textContent = 'Επιλέξτε εργαζόμενο'; btn.disabled = true; return; }
    btn.disabled = false;
    const inside = isInside(sel.value);
    btn.textContent = inside ? 'Καταγραφή εξόδου' : 'Καταγραφή εισόδου';
  }
  document.getElementById('btnManualToggle').addEventListener('click', ()=>{
    const sel = document.getElementById('manualSelect');
    if(!sel.value) return;
    const inside = isInside(sel.value);
    const emp = logEvent(sel.value, inside?'out':'in');
    showResultCard(emp, inside?'out':'in');
    updateManualBtn();
  });

  /* ---------- camera scanning ---------- */
  let stream = null, scanTimer = null, detector = null;
  const recentScans = {}; // code -> ts, debounce

  document.getElementById('btnStartCam').addEventListener('click', startCamera);
  document.getElementById('btnStopCam').addEventListener('click', stopCamera);

  async function startCamera(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    }catch(err){
      toast("Δεν δόθηκε πρόσβαση στην κάμερα.");
      return;
    }
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    document.getElementById('camOff').style.display = 'none';
    video.style.display = 'block';
    document.getElementById('camFrame').style.display = 'block';
    document.getElementById('camControls').hidden = false;

    if('BarcodeDetector' in window){
      try{ detector = new BarcodeDetector({ formats: ['qr_code'] }); }catch(e){ detector = null; }
    }
    scanTimer = setInterval(scanFrame, 350);
  }
  function stopCamera(){
    if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    document.getElementById('camOff').style.display = 'flex';
    document.getElementById('video').style.display = 'none';
    document.getElementById('camFrame').style.display = 'none';
    document.getElementById('camControls').hidden = true;
  }
  async function scanFrame(){
    const video = document.getElementById('video');
    if(!video.videoWidth) return;
    let code = null;
    if(detector){
      try{
        const results = await detector.detect(video);
        if(results && results[0]) code = results[0].rawValue;
      }catch(e){ /* fall through to canvas method next tick */ }
    } else {
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const result = window.jsQR ? jsQR(imgData.data, imgData.width, imgData.height) : null;
      if(result) code = result.data;
    }
    if(code) handleScannedCode(code.trim());
  }
  function handleScannedCode(code){
    const now = Date.now();
    if(recentScans[code] && now - recentScans[code] < 4000) return;
    recentScans[code] = now;

    const emp = employeeByCode(code);
    if(!emp){
      showResultCard(null, 'err');
      return;
    }
    if(emp.archived){
      showResultCard(null, 'err', 'Ο εργαζόμενος είναι αρχειοθετημένος.');
      return;
    }
    const inside = isInside(emp.id);
    logEvent(emp.id, inside?'out':'in');
    showResultCard(emp, inside?'out':'in');
  }

  function showResultCard(emp, type, customMsg){
    if(navigator.vibrate) navigator.vibrate(type==='err'?[80,60,80]:60);
    const root = document.getElementById('modalRoot');
    let inner;
    if(type==='err'){
      inner = `<div class="circle err">✕</div>
        <h2>Άγνωστη κάρτα</h2>
        <div class="status-line" style="color:var(--red);">${customMsg||'Το QR δεν αντιστοιχεί σε εργαζόμενο.'}</div>
        <div class="meta">Δοκίμασε ξανά ή χρησιμοποίησε τη χειροκίνητη καταγραφή.</div>`;
    } else {
      const isIn = type==='in';
      let extra = '';
      if(!isIn){
        const evs = state.events.filter(e=>e.employeeId===emp.id).sort((a,b)=>a.ts.localeCompare(b.ts));
        const lastIn = [...evs].reverse().find(e=>e.type==='in' && e.ts < evs[evs.length-1].ts) || evs[evs.length-2];
        if(lastIn){
          const dur = Date.now() - new Date(lastIn.ts).getTime();
          extra = `<div class="meta">Διάρκεια βάρδιας: ${fmtDur(dur)}</div>`;
        }
      }
      inner = `<div class="circle ${isIn?'in':'out'}">${isIn?'✓':'→'}</div>
        <h2>${escapeHtml(emp.name)}</h2>
        <div class="status-line ${isIn?'in':'out'}">${isIn?'Είσοδος καταγράφηκε':'Έξοδος καταγράφηκε'}</div>
        <div class="meta">${fmtTime(new Date())}${emp.role?' · '+escapeHtml(emp.role):''}</div>
        ${extra}`;
    }
    root.innerHTML = `<div class="scan-overlay" id="resultOverlay"><div class="scan-card">${inner}</div></div>`;
    setTimeout(()=>{
      const ov = document.getElementById('resultOverlay');
      if(ov) ov.remove();
    }, 2400);
    document.getElementById('resultOverlay').addEventListener('click', ()=>{
      const ov = document.getElementById('resultOverlay'); if(ov) ov.remove();
    });
    if(document.getElementById('tab-present').hidden===false) renderPresent();
  }

  /* ---------- history ---------- */
  const dateInput = document.getElementById('historyDate');
  dateInput.value = todayStr();
  dateInput.addEventListener('change', renderHistory);
  document.getElementById('historyFilter').addEventListener('change', renderHistory);

  function renderHistoryFilterOptions(){
    const sel = document.getElementById('historyFilter');
    const current = sel.value;
    const emps = state.employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'el'));
    sel.innerHTML = '<option value="">Όλοι</option>' + emps.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
    sel.value = current;
  }

  function eventsForDate(dateStr){
    return state.events.filter(e=> e.ts.slice(0,10) === dateStr );
  }

  function renderHistory(){
    renderHistoryFilterOptions();
    const dateStr = dateInput.value || todayStr();
    const filterId = document.getElementById('historyFilter').value;
    let evs = eventsForDate(dateStr);
    if(filterId) evs = evs.filter(e=>e.employeeId===filterId);
    evs = evs.sort((a,b)=>a.ts.localeCompare(b.ts));

    // group by employee, pair in/out
    const byEmp = {};
    evs.forEach(e=>{ (byEmp[e.employeeId] = byEmp[e.employeeId] || []).push(e); });

    let grandTotalMs = 0;
    const rows = [];
    Object.keys(byEmp).forEach(empId=>{
      const list = byEmp[empId];
      const name = list[0].employeeName;
      let openIn = null;
      let empTotal = 0;
      list.forEach(ev=>{
        if(ev.type==='in'){ openIn = ev; }
        else if(ev.type==='out'){
          const start = openIn ? new Date(openIn.ts) : null;
          const end = new Date(ev.ts);
          const dur = start ? (end-start) : 0;
          rows.push({ name, inTs: start, outTs: end, dur, ongoing:false });
          if(start) empTotal += dur;
          openIn = null;
        }
      });
      if(openIn){
        const dur = Date.now() - new Date(openIn.ts).getTime();
        rows.push({ name, inTs: new Date(openIn.ts), outTs: null, dur, ongoing:true });
        empTotal += dur;
      }
      grandTotalMs += empTotal;
    });
    rows.sort((a,b)=> a.inTs - b.inTs);

    document.getElementById('dayTotal').textContent = fmtDur(grandTotalMs);
    const list = document.getElementById('historyList');
    if(rows.length===0){
      list.innerHTML = '<div class="empty"><span class="ic">🕒</span>Δεν υπάρχουν καταγραφές για αυτή την ημερομηνία.</div>';
    } else {
      list.innerHTML = `<table><thead><tr><th>Εργαζόμενος</th><th>Είσοδος</th><th>Έξοδος</th><th>Διάρκεια</th></tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td>${escapeHtml(r.name)}</td>
          <td>${r.inTs?fmtTime(r.inTs):'—'}</td>
          <td>${r.outTs?fmtTime(r.outTs):'<span class="badge in" style="padding:2px 8px;">σε εξέλιξη</span>'}</td>
          <td>${fmtDur(r.dur)}</td>
        </tr>`).join('')}
      </tbody></table>`;
    }

    window.__historyRows = rows;
    window.__historyDate = dateStr;
    setupExportButton();
  }

  function setupExportButton(){
    const btn = document.getElementById('btnExportCsv');
    btn.hidden = false;
    btn.onclick = ()=>{
      const rows = window.__historyRows || [];
      let csv = "Εργαζόμενος,Είσοδος,Έξοδος,Διάρκεια (ώρες:λεπτά)\n";
      rows.forEach(r=>{
        csv += `"${(r.name||'').replace(/"/g,'""')}",${r.inTs?fmtTime(r.inTs):''},${r.outTs?fmtTime(r.outTs):'σε εξέλιξη'},${fmtDur(r.dur)}\n`;
      });
      const blob = new Blob(["\uFEFF" + csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `oxygen-workplace-${window.__historyDate}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };
  }

  /* ---------- init ---------- */
  initStorage();
})();
</script>
</body>
</html>
